<svg viewBox="74 77 364 364" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ADEXTO">
  <!-- viewBox dipangkas mepet ke kotak batas tinta sesungguhnya (x 74-438, y 104-414):
       sisinya 364 = lebar tinta, berpusat vertikal di tinta (y 259). Dulu 0 0 512 512
       karena glyph masih duduk di atas plat dan butuh jarak ke tepi plat. Setelah plat
       dibuang, jarak itu jadi ruang mati dan logo terlihat kecil di slot yang sama.
       Sekarang tinta mengisi 100% lebar kotak, bukan 71%.
       Kotaknya tetap PERSEGI dengan sengaja: MarketPicker, TokenTerminal, dan
       /explorer merender gambar token dengan object-cover, dan berkas ini adalah
       gambar cadangannya. Kotak non-persegi akan terpotong di sana. -->
  <mask id="adexto-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect width="512" height="512" fill="#fff"/>
    <g transform="rotate(-14 256 286)"><path d="M76,286 a180,66 0 1 0 360,0 a180,66 0 1 0 -360,0 Z M99,276 a169,55 0 1 0 338,0 a169,55 0 1 0 -338,0 Z" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/></g>
    <circle cx="388" cy="302" r="34" fill="none" stroke="#000" stroke-width="20"/>
  </mask>
  <g id="g" fill="#141110">
    <path d="M256,104 L438,414 L350,414 L256,214 L162,414 L74,414 Z" mask="url(#adexto-cut)"/>
    <g transform="rotate(-14 256 286)"><path d="M76,286 a180,66 0 1 0 360,0 a180,66 0 1 0 -360,0 Z M99,276 a169,55 0 1 0 338,0 a169,55 0 1 0 -338,0 Z" fill-rule="evenodd"/></g>
    <circle cx="388" cy="302" r="34"/>
  </g>
</svg>
