specVersion: 1.0.0
description: >
  ADEXTO curve factory and per-token sovereign bonding curves. Indexes launches
  and their optional ERC-8004 agent identity binding, swaps, creator fee claims,
  and treasury-funded buyback burns. Reserves and prices come entirely from
  event data, so the subgraph needs no eth_call and no archive node.
repository: https://github.com/0xcuy/adexto
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
# PERINGATAN: `graph build --network X` MENULIS ULANG BERKAS INI DI TEMPAT
#
# graph-cli menyalin `address` dan `startBlock` dari networks.json ke manifest
# ini, bukan hanya ke build/, dan menghapus semua komentar saat menulis ulang.
# Jadi nilai di bawah selalu hanya sisa build terakhir siapa pun. Nilai di
# bawah sengaja placeholder supaya tidak ada yang memperlakukannya sebagai
# konfigurasi sungguhan.
#
# Sumber kebenarannya adalah networks.json, yang dihasilkan dari
# build/deployments.json oleh scripts/gen-subgraph-networks.py. Pakai skrip
# npm (`npm run build:0g-testnet`, `npm run deploy:base-sepolia`, ...) yang
# selalu memanggil `node reset-manifest.mjs` setelahnya untuk memulihkan
# berkas ini.
dataSources:
  - kind: ethereum
    name: AdextoCurveFactory
    network: 0g
    source:
      abi: AdextoCurveFactory
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Project
        - Curve
        - GlobalStats
        - AgentBinding
      abis:
        - name: AdextoCurveFactory
          file: ./abis/AdextoCurveFactory.json
        - name: SovereignCurve
          file: ./abis/SovereignCurve.json
      eventHandlers:
        - event: TrinityProjectDeployed(indexed address,indexed address,indexed
            address,string,string,uint256,uint256,uint256,uint256,uint256,uint256,bytes32)
          handler: handleTrinityProjectDeployed
        - event: AgentBound(indexed address,indexed uint256,indexed address,address)
          handler: handleAgentBound
templates:
  - kind: ethereum
    name: SovereignCurve
    network: 0g
    source:
      abi: SovereignCurve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/curve.ts
      entities:
        - Curve
        - Swap
        - BuybackBurn
        - CreatorFeeClaim
        - CurveDayData
        - GlobalStats
      abis:
        - name: SovereignCurve
          file: ./abis/SovereignCurve.json
      eventHandlers:
        - event: CurveInitialized(uint256,uint256,uint256)
          handler: handleCurveInitialized
        - event: Swap(indexed address,indexed
            address,bool,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: AutoBuybackExecuted(uint256,uint256,uint256,uint256,uint256)
          handler: handleAutoBuybackExecuted
        - event: CreatorFeesClaimed(indexed address,uint256)
          handler: handleCreatorFeesClaimed
