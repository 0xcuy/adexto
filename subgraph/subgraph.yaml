specVersion: 1.0.0
description: >
  ADEXTO curve factories and per-token sovereign bonding curves. Indexes
  launches and their optional ERC-8004 agent identity binding, swaps, creator
  fee claims, protocol fee claims, and treasury-funded buyback burns. Three
  factory generations are indexed side by side: 0.10.0 markets charge three fee
  legs, 0.11.0 markets add a fourth protocol leg on top, and ADEXTO v1 (1.0.0)
  markets carve that protocol leg out of the total. 0.10.0 and 0.11.0 curves
  emit different Swap signatures, so each has its own template; v1 curves emit
  the same events as 0.11.0 and share its template. Reserves and prices come
  entirely from event data, so the subgraph needs no eth_call and no archive
  node.
repository: https://github.com/0xcuy/adexto
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
# PERINGATAN: `graph build --network X` MENULIS ULANG BERKAS INI DI TEMPAT
#
# graph-cli menyalin `address` dan `startBlock` dari networks.json ke manifest
# ini, bukan hanya ke build/, dan menghapus semua komentar saat menulis ulang.
# Jadi nilai di bawah selalu hanya sisa build terakhir siapa pun. Nilai di
# bawah sengaja placeholder supaya tidak ada yang memperlakukannya sebagai
# konfigurasi sungguhan.
#
# Sumber kebenarannya adalah networks.json, yang dihasilkan dari
# build/deployments.json oleh scripts/gen-subgraph-networks.py. Pakai skrip
# npm (`npm run build:0g-testnet`, `npm run deploy:base-sepolia`, ...) yang
# selalu memanggil `node reset-manifest.mjs` setelahnya untuk memulihkan
# berkas ini.
#
# TIGA GENERASI FACTORY, DAN SEMUANYA HARUS TETAP ADA
#
# Manifest ini memuat tiga dataSource dan dua template:
#
#   AdextoCurveFactory + SovereignCurve  -> generasi 0.10.0
#   AdextoFactory      + AdextoCurve     -> generasi 0.11.0, menambah kaki
#                                           fee protokol
#   AdextoFactoryV1    + AdextoCurve     -> ADEXTO v1 (1.0.0), kaki protokol
#                                           diambil dari dalam total
#
# Yang lebih baru DITAMBAHKAN, bukan menggantikan yang lama. Bytecode factory
# tidak bisa diubah, jadi pasar yang sudah lahir dari factory lama lahir dari
# alamat itu selamanya dan harus terus terindeks. Mengarahkan satu dataSource
# ke alamat baru akan menghapus pasar-pasar itu dari subgraph — dan subgraph
# yang menjawab lebih sedikit pasar daripada yang ada di chain lebih buruk
# daripada yang gagal, sebab tidak ada yang tampak rusak.
#
# `Swap` 0.10.0 dan 0.11.0 bertanda tangan BEDA: 0.11.0 menyelipkan
# `protocolFee` sebelum kedua reserve, jadi sebelas field dan `topic0` yang
# lain sama sekali. Itu satu-satunya alasan ada dua template. Event v1 identik
# dengan 0.11.0, di sumber kontrak maupun di log chain, jadi v1 memakai ABI
# dan template 0.11.0; yang berbeda hanya alamat factory dan `curveVersion`.
# `TrinityProjectDeployed` dan `AgentBound` sengaja dibuat identik di ketiga
# kontraknya, jadi ketiga dataSource memakai bentuk event yang sama.
#
# Logikanya TIDAK diduplikasi: kelima berkas mapping hanya adaptor tipis di
# atas satu implementasi di src/shared.ts.
dataSources:
  - kind: ethereum
    name: AdextoCurveFactory
    network: 0g
    source:
      abi: AdextoCurveFactory
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Project
        - Curve
        - GlobalStats
        - AgentBinding
      abis:
        - name: AdextoCurveFactory
          file: ./abis/AdextoCurveFactory.json
        - name: SovereignCurve
          file: ./abis/SovereignCurve.json
      eventHandlers:
        - event: TrinityProjectDeployed(indexed address,indexed address,indexed
            address,string,string,uint256,uint256,uint256,uint256,uint256,uint256,bytes32)
          handler: handleTrinityProjectDeployed
        - event: AgentBound(indexed address,indexed uint256,indexed address,address)
          handler: handleAgentBound
  - kind: ethereum
    name: AdextoFactory
    network: 0g
    source:
      abi: AdextoFactory
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory-v11.ts
      entities:
        - Project
        - Curve
        - GlobalStats
        - AgentBinding
      abis:
        - name: AdextoFactory
          file: ./abis/AdextoFactory.json
        - name: AdextoCurve
          file: ./abis/AdextoCurve.json
      eventHandlers:
        - event: TrinityProjectDeployed(indexed address,indexed address,indexed
            address,string,string,uint256,uint256,uint256,uint256,uint256,uint256,bytes32)
          handler: handleTrinityProjectDeployed
        - event: AgentBound(indexed address,indexed uint256,indexed address,address)
          handler: handleAgentBound
  - kind: ethereum
    name: AdextoFactoryV1
    network: 0g
    source:
      abi: AdextoFactory
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory-v1.ts
      entities:
        - Project
        - Curve
        - GlobalStats
        - AgentBinding
      abis:
        - name: AdextoFactory
          file: ./abis/AdextoFactory.json
        - name: AdextoCurve
          file: ./abis/AdextoCurve.json
      eventHandlers:
        - event: TrinityProjectDeployed(indexed address,indexed address,indexed
            address,string,string,uint256,uint256,uint256,uint256,uint256,uint256,bytes32)
          handler: handleTrinityProjectDeployed
        - event: AgentBound(indexed address,indexed uint256,indexed address,address)
          handler: handleAgentBound
templates:
  - kind: ethereum
    name: SovereignCurve
    network: 0g
    source:
      abi: SovereignCurve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/curve.ts
      entities:
        - Curve
        - Swap
        - BuybackBurn
        - CreatorFeeClaim
        - CurveDayData
        - GlobalStats
      abis:
        - name: SovereignCurve
          file: ./abis/SovereignCurve.json
      eventHandlers:
        - event: CurveInitialized(uint256,uint256,uint256)
          handler: handleCurveInitialized
        - event: Swap(indexed address,indexed
            address,bool,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: AutoBuybackExecuted(uint256,uint256,uint256,uint256,uint256)
          handler: handleAutoBuybackExecuted
        - event: CreatorFeesClaimed(indexed address,uint256)
          handler: handleCreatorFeesClaimed
  - kind: ethereum
    name: AdextoCurve
    network: 0g
    source:
      abi: AdextoCurve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/curve-v11.ts
      entities:
        - Curve
        - Swap
        - BuybackBurn
        - CreatorFeeClaim
        - ProtocolFeeClaim
        - CurveDayData
        - GlobalStats
      abis:
        - name: AdextoCurve
          file: ./abis/AdextoCurve.json
      eventHandlers:
        - event: CurveInitialized(uint256,uint256,uint256)
          handler: handleCurveInitialized
        - event: Swap(indexed address,indexed
            address,bool,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: AutoBuybackExecuted(uint256,uint256,uint256,uint256,uint256)
          handler: handleAutoBuybackExecuted
        - event: CreatorFeesClaimed(indexed address,uint256)
          handler: handleCreatorFeesClaimed
        - event: ProtocolFeesClaimed(indexed address,uint256)
          handler: handleProtocolFeesClaimed
