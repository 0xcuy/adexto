# ADEXTO subgraph schema.
#
# WHY THE OLD SCHEMA WAS REPLACED ENTIRELY
#
# The previous schema had only `Project` and `GlobalStats`, filled from a single
# event of the first factory generation (`TrinityProjectCreated`), and even that
# never ran, because its manifest pointed at `network: mainnet` for an address
# that actually lives on 0G. Meanwhile the /docs page claimed the subgraph
# "indexes curve depth, swap transactions, and real-time treasury buyback
# burns". None of the three had a place in the old schema.
#
# WHY NO `eth_call` IS NEEDED AT ALL
#
# This decides the whole shape of the schema. `SovereignCurve.Swap` emits
# `nativeReserveAfter` and `tokenReserveAfter`, the reserves AFTER each trade,
# and `CurveInitialized` emits `virtualNative`, `curveTokens` and
# `openingPrice`. So the entire curve state can be maintained from the event
# stream alone.
#
# That is not a minor convenience. The public 0G RPC runs pruned, not archive
# (`eth_getBalance` fails with `missing trie node` even 1,000 blocks back), and
# it does not provide `trace_block`. A subgraph that calls view functions would
# die there. Hence one maintenance rule that must not be broken: DO NOT add
# `.bind()` or `try_*` to any mapping. The moment one contract call goes in, the
# 0G path needs an archive node, and the cost turns from one container into an
# infrastructure problem.
#
# `metadataRoot`, NOT `teeAttestationRoot`
#
# This field used to be called `teeAttestationRoot`, in the schema and in the
# contract. Its value is the 0G DA storage root of the launch metadata, a
# content hash. It is not a hardware attestation report, and the old name is
# what led the product page to claim an attestation that nobody ever verified.

"""
An ERC-8004 binding recorded by the `AgentBound` event.

WHY THIS IS ITS OWN ENTITY INSTEAD OF BEING WRITTEN STRAIGHT INTO `Project`

The factory emits `AgentBound` BEFORE `TrinityProjectDeployed` (lines 330 and
334 of AdextoCurveFactory.sol), so when its handler runs, the `Project` entity
does not exist yet. Writing a half-built Project there would violate its
non-null fields. So the binding is stored here first, then merged by
`handleTrinityProjectDeployed`, which runs after it in the same transaction.

The entity is also useful on its own: query it to find every token bound to one
agent.
"""
type AgentBinding @entity(immutable: true) {
  "Token address, lowercase. Same as Project.id."
  id: ID!
  token: Bytes!
  agentId: BigInt!
  agentRegistry: Bytes!
  "Agent owner at launch, as verified by the factory through `ownerOf`."
  ownerAtLaunch: Bytes!
  boundAtBlock: BigInt!
  boundAtTx: Bytes!
}

"""
One launch.

THERE IS NO `chainId` HERE, AND THAT IS ON PURPOSE. `ethereum.Event` does not
provide it and graph-ts does not export it, so the only ways to fill it are
guessing or pinning it per deployment, and both are good ways to make two
markets on different chains look like one. A subgraph is always one network,
so the chain id is metadata about its DEPLOYMENT, not about this entity.
`/api/graphql` attaches it server-side, where the value is known for certain.
"""
type Project @entity(immutable: false) {
  "Token address, lowercase."
  id: ID!
  token: Bytes!
  curve: Curve!
  creator: Bytes!
  name: String!
  symbol: String!
  "Supply in whole units, as sent to the factory."
  initialSupply: BigInt!
  "Tokens that actually entered the curve. Equal to the whole minted supply."
  curveTokens: BigInt!
  "0G DA storage root of the launch metadata. Not a hardware attestation."
  metadataRoot: Bytes!

  """
  Whether this launch binds an ERC-8004 agent identity.

  READ THIS FIELD FIRST, NOT `agentId`. Agent id 0 is a real agent with an owner
  on every mainnet where this was checked, so `agentId == 0` CANNOT mean "no
  agent". The contract once got this wrong, and it was fixed before broadcast.
  """
  agentBound: Boolean!
  "ERC-8004 agent id. Meaningful only when `agentBound` is true."
  agentId: BigInt
  "The Identity Registry where `agentId` lives. Null when not bound."
  agentRegistry: Bytes
  """
  The agent owner AT launch, as verified by the factory through `ownerOf`.
  Ownership of the agent can move afterwards; the binding to this token cannot.
  """
  agentOwnerAtLaunch: Bytes

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTx: Bytes!
}

type Curve @entity(immutable: false) {
  "Curve address, lowercase."
  id: ID!
  project: Project
  "Set from CurveInitialized. The opening reserve, which was never real money."
  virtualNative: BigInt!
  "Tokens loaded into the curve at initialization (T)."
  curveTokens: BigInt!
  """
  The curve's opening price: WHOLE native per WHOLE token, the SAME unit as
  `spotPriceNative` and `floorPriceNative`.

  This field used to be a `BigInt!` holding the contract's raw formula
  (`virtualNative * 1e18 / curveTokens`), which is wei per 1e18 tokens. So one
  entity carried three price fields in TWO different units, 1e18 apart, with no
  explanation, even though all three names end in `PriceNative`. Computing "how
  far it is up since launch" from `openingPriceNative` and `spotPriceNative`
  gave a result off by a factor of 1e18.

  Caught while verifying the handlers against real devchain events, before this
  subgraph was published: changing a field's type after publishing means a new
  version and new curation.
  """
  openingPriceNative: BigDecimal!

  # ── Live state, all derived from events ───────────────────────────────────
  "virtualNative + real native. Taken from the last swap's nativeReserveAfter."
  reserveNative: BigInt!
  "curveTokens - tokensSold. Taken from the last swap's tokenReserveAfter."
  reserveToken: BigInt!
  tokensSold: BigInt!
  "reserveNative / reserveToken. This is the spot price the UI uses."
  spotPriceNative: BigDecimal!

  """
  The VERSION of this curve's contract: "0.10.0", "0.11.0" or "1.0.0" (ADEXTO v1).

  Stored because the generations live side by side and only 0.11.0 and v1 charge
  a protocol fee. Without this field, `protocolFeeBps: 0` on an old curve could
  not be told apart from a newer curve that happens to charge zero, and a reader
  would conclude that the rate can change, when it is immutable per curve.

  Set by a mapping bound to one specific factory address, so the value is a fact
  about its data source, not a guess.
  """
  curveVersion: String!

  # ── Fee split, fixed at deployment ────────────────────────────────────────
  depthFeeBps: BigInt!
  creatorFeeBps: BigInt!
  treasuryBuybackBps: BigInt!
  """
  The protocol leg. A 0.11.0 curve charges it ON TOP of the total the creator
  configured; a v1 (1.0.0) curve carves it out of that total. Zero on every
  0.10.0 curve, permanently, because the rate is immutable.
  """
  protocolFeeBps: BigInt!

  # ── Running totals ────────────────────────────────────────────────────────
  "Depth fees that stay in the curve. This is what lifts the price floor."
  totalDepthFees: BigInt!
  totalCreatorFees: BigInt!
  totalTreasuryFees: BigInt!
  totalCreatorFeesClaimed: BigInt!
  """
  Protocol fees this curve has ever charged.

  They do NOT lift the price floor, and that is the easiest distinction to get
  wrong: the depth slice stays in the curve, so the floor rises, while the
  protocol slice LEAVES the curve. Adding both to `totalDepthFees` would show a
  floor higher than the curve can pay.
  """
  totalProtocolFees: BigInt!
  totalProtocolFeesClaimed: BigInt!
  volumeNative: BigInt!
  swapCount: BigInt!
  buyCount: BigInt!
  sellCount: BigInt!
  tokensBurned: BigInt!
  """
  The lowest price the curve can reach, when every circulating token is sold
  back: (virtualNative + totalDepthFees) / curveTokens. It rises monotonically
  with volume, which is the property that sets this curve apart, so it is
  computed here instead of being recomputed by every client.
  """
  floorPriceNative: BigDecimal!

  initialized: Boolean!
  createdAtBlock: BigInt!
  lastSwapTimestamp: BigInt

  swaps: [Swap!]! @derivedFrom(field: "curve")
  buybacks: [BuybackBurn!]! @derivedFrom(field: "curve")
  dayData: [CurveDayData!]! @derivedFrom(field: "curve")
  protocolFeeClaims: [ProtocolFeeClaim!]! @derivedFrom(field: "curve")
}

type Swap @entity(immutable: true) {
  "txHash-logIndex."
  id: ID!
  curve: Curve!
  project: Project
  trader: Bytes!
  recipient: Bytes!
  "true = native in, tokens out."
  isBuy: Boolean!
  amountIn: BigInt!
  amountOut: BigInt!
  depthFee: BigInt!
  creatorFee: BigInt!
  treasuryFee: BigInt!
  """
  The protocol leg of this fill. Zero on every swap of a 0.10.0 curve, whose
  event has no such field at all.
  """
  protocolFee: BigInt!
  "Reserves after the trade, straight from the event. No eth_call."
  reserveNativeAfter: BigInt!
  reserveTokenAfter: BigInt!
  "Price after the trade. The chart candles are built from this."
  priceNativeAfter: BigDecimal!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
}

type BuybackBurn @entity(immutable: true) {
  id: ID!
  curve: Curve!
  "Native from the buyback vault, spent on the curve."
  amountInNative: BigInt!
  "Tokens bought and then burned, so the supply really shrinks."
  tokensBurned: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type CreatorFeeClaim @entity(immutable: true) {
  id: ID!
  curve: Curve!
  to: Bytes!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
A protocol fee withdrawal from a 0.11.0 or v1 curve.

`to` is recorded even though the destination is immutable, and that is not
redundant: precisely because `claimProtocolFees()` is permissionless, anyone
may trigger it, so `caller` and `to` can differ, and the only way to prove the
destination cannot be hijacked is to store both.
"""
type ProtocolFeeClaim @entity(immutable: true) {
  id: ID!
  curve: Curve!
  "The immutable destination written in the contract."
  to: Bytes!
  "Who triggered the withdrawal. Anyone may."
  caller: Bytes!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Daily totals per curve.

They exist so the explorer can show 24-hour volume and the price range without
scanning every swap on the client, which is exactly the work an indexer should
do. `open`/`high`/`low`/`close` use the post-swap price, so the candles match
what actually happened on the curve.
"""
type CurveDayData @entity(immutable: false) {
  "curveAddress-dayStartTimestamp."
  id: ID!
  curve: Curve!
  dayStartTimestamp: BigInt!
  volumeNative: BigInt!
  swapCount: BigInt!
  openPriceNative: BigDecimal!
  highPriceNative: BigDecimal!
  lowPriceNative: BigDecimal!
  closePriceNative: BigDecimal!
  depthFees: BigInt!
  creatorFees: BigInt!
  treasuryFees: BigInt!
  protocolFees: BigInt!
}

type GlobalStats @entity(immutable: false) {
  "Always 'global'."
  id: ID!
  totalProjects: BigInt!
  totalCurves: BigInt!
  totalSwaps: BigInt!
  totalVolumeNative: BigInt!
  totalDepthFees: BigInt!
  totalCreatorFees: BigInt!
  totalTreasuryFees: BigInt!
  totalProtocolFees: BigInt!
  totalTokensBurned: BigInt!
  lastUpdatedTimestamp: BigInt!
}
