name = "adexto-x402-edge"
main = "src/index.ts"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]
account_id = "c1a94ec73ec04756ac77a82a6ef21df6"

[vars]
# Penerima USDC. Treasury protokol, karena protokol yang membelanjakan persediaan 0G
# untuk mengantar tokennya. DULU nilainya alamat creator sementara namanya
# VAULT_TREASURY — dua hal berbeda dipanggil satu nama. Payee TIDAK PERNAH dari header.
X402_PAYEE = "0x24268Fffc119ec5550F68e80D94476fD64daE967"

# 0,02 USDC per pembelian. Ditetapkan dari angka terukur: satu settlement
# transferWithAuthorization di Base memakai 102.352 gas, sekitar $0,0028 pada 0,011
# gwei. Harga 0,005 USDC yang lama hampir tidak menutupi gasnya sendiri.
X402_PRICE_ATOMIC = "20000"

# Ditahan dari nilai USDC sebelum dikonversi ke native: menutup gas di dua chain dan
# risiko harga native bergerak antara kutipan dan eksekusi.
X402_SPREAD_BPS = "300"
# Toleransi antara kutipan dan eksekusi, dipakai sebagai minTokensOut.
X402_SLIPPAGE_BPS = "150"

# Relai kami sendiri, BUKAN RPC Base publik. Diukur dari dalam Worker ini: drpc 429,
# publicnode -32005, 1rpc -32001, mainnet.base.org -32016, llamarpc 525 — IP egress
# Cloudflare dibatasi penyedia RPC, jadi setiap pembayaran mati di titik pertama ia
# menyentuh Base. VPS punya IP sendiri dan meneruskannya.
BASE_RPC = "https://adexto.xyz/api/rpc/base"
# Diuji, bukan disalin dari dokumentasi: `evmrpc-mainnet.0g.ai` tidak menjawab sama
# sekali, dan `rpc.ankr.com/0g` menuntut kunci. Yang ini balas chainId 0x4115 = 16661.
OG_RPC = "https://evmrpc.0g.ai"
# Satu asal untuk registry pasar DAN harga, supaya tidak ada sumber kebenaran kedua.
ADEXTO_ORIGIN = "https://adexto.xyz"

# Rahasia, disetel lewat `wrangler secret put`, tidak pernah di berkas ini:
#   RPC_RELAY_SECRET — kunci bersama untuk relai di BASE_RPC; tanpa ini relai 401
#   X402_RELAYER_PRIVATE_KEY — membayar gas di Base DAN memegang persediaan 0G yang
#   dibelanjakan untuk mengantar token. Plafon kerugian kalau bocor adalah saldo
#   dompet itu, bukan lebih: otorisasi USDC ditandatangani pembayar, jadi kunci ini
#   tidak bisa memindahkan dana siapa pun. Kunci deployer TIDAK PERNAH dipakai di
#   sini karena ia memegang factory di empat chain, treasury, dan namespace ERC-8004.
