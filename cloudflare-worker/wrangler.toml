name = "adexto-x402-edge"

# Hostname sendiri, bukan `*.workers.dev`.
#
# KENAPA CUSTOM DOMAIN, BUKAN SEKADAR RECORD DNS
#
# Percobaan sebelumnya membuat `edge.adexto.xyz` dan berhenti di situ, lalu subdomain itu
# membalas HTTP 525 — cukup lama sampai frasanya masuk daftar terlarang di
# `audit_claims.mjs`. Penyebabnya bukan DNS yang salah: zone ini punya wildcard
# `*.adexto.xyz` yang proxied ke VPS, jadi hostname apa pun MEMANG resolve, lalu
# Cloudflare mencoba TLS ke origin yang tidak punya sertifikat untuk subdomain itu.
# Handshake gagal, dan 525 adalah kode untuk kegagalan itu.
#
# `custom_domain = true` menyelesaikannya di lapisan yang benar: hostname-nya diikat ke
# Worker ini, Cloudflare menerbitkan sertifikat edge-nya sendiri, dan permintaan tidak
# pernah menyentuh VPS. Menambah record DNS lagi tidak akan pernah memperbaikinya karena
# masalahnya bukan resolusi.
#
routes = [
  { pattern = "x402.adexto.xyz", custom_domain = true }
]

# WAJIB, dan ini bukan pilihan gaya.
#
# Begitu `routes` ada di berkas ini, wrangler MEMATIKAN `*.workers.dev` secara default.
# Ia memperingatkannya saat deploy, dan akibatnya langsung: situs live, halaman demo,
# `/x402`, README, dan audit klaim semuanya masih menunjuk URL workers.dev — jadi
# memperbaiki tampilan alamat justru akan mematikan endpoint yang sudah dipakai.
#
# Dibiarkan `true` sampai setiap rujukan berpindah, dan bahkan setelah itu tetap berguna:
# klien mana pun di luar sana yang sudah menyimpan URL lama tidak rusak karena kami
# mengganti nama.
workers_dev = true
main = "src/index.ts"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]
account_id = "c1a94ec73ec04756ac77a82a6ef21df6"

[vars]
# Penerima USDC. Treasury protokol, karena protokol yang membelanjakan persediaan 0G
# untuk mengantar tokennya. DULU nilainya alamat creator sementara namanya
# VAULT_TREASURY — dua hal berbeda dipanggil satu nama. Payee TIDAK PERNAH dari header.
X402_PAYEE = "0x24268Fffc119ec5550F68e80D94476fD64daE967"

# 0,10 USDC per pembelian, dari untung-rugi yang DIUKUR pada dua transaksi sungguhan,
# bukan ditebak:
#   settlement Base   85.768 gas = $0,00128
#   buy 0G            98.918 gas = $0,00008
#   gas total                     $0,00136
# Pendapatan hanya spread. Pada 300 bps, order $0,02 menghasilkan $0,0006 dan karena
# itu MERUGI $0,00075 setiap kali — terbukti pada pembelian sungguhan pertama. Break
# even ada di sekitar $0,05; pada $0,10 marginnya sekitar +$0,0016.
#
# Naikkan harganya berarti setiap pembelian memakan lebih banyak persediaan 0G, jadi
# jumlah order yang bisa dilayani turun. Itu batas persediaan, bukan batas harga.
X402_PRICE_ATOMIC = "100000"

# Ditahan dari nilai USDC sebelum dikonversi ke native: menutup gas di dua chain dan
# risiko harga native bergerak antara kutipan dan eksekusi.
X402_SPREAD_BPS = "300"
# Toleransi antara kutipan dan eksekusi, dipakai sebagai minTokensOut.
X402_SLIPPAGE_BPS = "150"

# Relai kami sendiri, BUKAN RPC Base publik. Diukur dari dalam Worker ini: drpc 429,
# publicnode -32005, 1rpc -32001, mainnet.base.org -32016, llamarpc 525 — IP egress
# Cloudflare dibatasi penyedia RPC, jadi setiap pembayaran mati di titik pertama ia
# menyentuh Base. VPS punya IP sendiri dan meneruskannya.
BASE_RPC = "https://adexto.xyz/api/rpc/base"
# Diuji, bukan disalin dari dokumentasi: `evmrpc-mainnet.0g.ai` tidak menjawab sama
# sekali, dan `rpc.ankr.com/0g` menuntut kunci. Yang ini balas chainId 0x4115 = 16661.
OG_RPC = "https://evmrpc.0g.ai"
# Satu asal untuk registry pasar DAN harga, supaya tidak ada sumber kebenaran kedua.
ADEXTO_ORIGIN = "https://adexto.xyz"
# Kelipatan biaya gas yang harus tersedia di vault buyback sebelum burn dijalankan.
#
# Setiap pengiriman x402 adalah `buy` di kurva, jadi ia membayar kaki fee buyback dan
# `treasuryNative` naik sendiri pada setiap fill — tidak ada yang perlu dipindahkan
# antar chain. Yang perlu diputuskan hanya KAPAN membelanjakannya.
#
# Diukur di kurva $ADEXTO sebelum angka ini dipilih: vault memegang 0,000143 0G
# sementara satu panggilan `executeBuyback` memakan ~0,000506 0G gas. Membakar pada
# setiap fill berarti membelanjakan 3,5x nilai yang dihancurkan — otomatis, dan merugi.
#
# Dengan 3, sebuah burn baru berjalan ketika vault-nya bernilai minimal tiga kali gas
# pemicunya, jadi setiap burn selalu menghancurkan lebih banyak daripada biayanya.
# Naikkan untuk efisiensi lebih tinggi dengan burn lebih jarang; turunkan ke 1 berarti
# sekadar balik modal.
X402_BURN_GAS_MULTIPLE = "3"

# Rahasia, disetel lewat `wrangler secret put`, tidak pernah di berkas ini:
#   RPC_RELAY_SECRET — kunci bersama untuk relai di BASE_RPC; tanpa ini relai 401
#   X402_RELAYER_PRIVATE_KEY — membayar gas di Base DAN memegang persediaan 0G yang
#   dibelanjakan untuk mengantar token. Plafon kerugian kalau bocor adalah saldo
#   dompet itu, bukan lebih: otorisasi USDC ditandatangani pembayar, jadi kunci ini
#   tidak bisa memindahkan dana siapa pun. Kunci deployer TIDAK PERNAH dipakai di
#   sini karena ia memegang factory di empat chain, treasury, dan namespace ERC-8004.
