# Foundry sits on top of the existing layout rather than replacing it.
#
# Contracts stay where they are, and `scripts/compile-contracts.mjs` remains the build that
# produces deployable bytecode, because deployed bytecode is verified against that script's
# output. Foundry is here to TEST, not to build releases.
#
# `test` points at test/ in the root, not contracts/test/. compile-contracts.mjs compiles
# contracts/*.sol and contracts/test/*.sol, so Foundry tests there would pull forge-std into the
# deploy build, which solc-js cannot resolve.
[profile.default]
src = "contracts"
test = "test"
out = "build/forge-out"
cache_path = "build/forge-cache"
libs = ["lib", "node_modules"]
# Matched to scripts/compile-contracts.mjs: solc 0.8.37, optimizer 200 runs, EVM cancun, via-IR.
# If any of these drifts, what is tested is no longer what is deployed.
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# via-IR is required, not a preference: the curve's `sell()` holds more locals than the legacy
# pipeline can reach ("Stack too deep"). It also means the fuzz and invariant suites exercise the
# same pipeline that produces the deployed bytecode.
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]
# Raised from the default 256 runs. These properties are about curve arithmetic and solvency,
# and 256 samples are too few to reach the edges of the uint256 range.
[fuzz]
runs = 4096
max_test_rejects = 500000
# Stateful invariants: 512 sequences of 64 random actions each. This is what searches for an
# order of actions that makes the curve insolvent, rather than one bad call.
[invariant]
runs = 512
depth = 64
fail_on_revert = false
call_override = false
