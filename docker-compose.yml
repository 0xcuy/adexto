version: '3.8'

services:
  adexto-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adexto-production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OG_ROUTER_URL=https://router-api.0g.ai/v1
      - OG_ROUTER_API_KEY=${OG_ROUTER_API_KEY}
      - OG_MODEL=glm-5.2
      - OG_CHAIN_ID=16661
      - OG_RPC_URL=https://evmrpc.0g.ai
      - OG_STORAGE_INDEXER=https://indexer-storage-turbo.0g.ai
      - SIGNER_ADDRESS=0x8a3c7524Aaed081825aC88eC7f4cCECFc583ee7D
      - NEXT_PUBLIC_APP_URL=https://adexto.xyz
      - NEXT_PUBLIC_EDGE_GATEWAY=https://edge.adexto.xyz
    networks:
      - adexto-network

networks:
  adexto-network:
    driver: bridge
