# ADEXTO production stack.
#
# Secrets live in .env.local only. The previous revision hardcoded
# OG_ROUTER_API_KEY in this tracked file, which leaked it to anyone with repo
# access — rotate that key if it was ever committed.
services:
  adexto-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client bundle needs these at build time. Curve factory (0.9.0) first,
        # then the older seeded factory; chains.ts prefers the curve generation
        # when both are present.
        NEXT_PUBLIC_CURVE_FACTORY_0G: ${NEXT_PUBLIC_CURVE_FACTORY_0G:-}
        NEXT_PUBLIC_CURVE_FACTORY_ARBITRUM: ${NEXT_PUBLIC_CURVE_FACTORY_ARBITRUM:-}
        NEXT_PUBLIC_CURVE_FACTORY_BASE: ${NEXT_PUBLIC_CURVE_FACTORY_BASE:-}
        NEXT_PUBLIC_CURVE_FACTORY_MONAD: ${NEXT_PUBLIC_CURVE_FACTORY_MONAD:-}
        NEXT_PUBLIC_FACTORY_V2_0G: ${NEXT_PUBLIC_FACTORY_V2_0G:-}
        NEXT_PUBLIC_FACTORY_V2_ARBITRUM: ${NEXT_PUBLIC_FACTORY_V2_ARBITRUM:-}
        NEXT_PUBLIC_FACTORY_V2_BASE: ${NEXT_PUBLIC_FACTORY_V2_BASE:-}
        NEXT_PUBLIC_FACTORY_V2_MONAD: ${NEXT_PUBLIC_FACTORY_V2_MONAD:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://adexto.xyz}
        NEXT_PUBLIC_EDGE_GATEWAY: ${NEXT_PUBLIC_EDGE_GATEWAY:-https://edge.adexto.xyz}
    container_name: adexto-production
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Registry + telemetry persistence. Backed by the named volume below so
      # launched markets survive a container restart.
      - ADEXTO_DATA_DIR=/app/data
    volumes:
      - adexto-data:/app/data
    networks:
      - adexto-network

volumes:
  adexto-data:

networks:
  adexto-network:
    # Explicit name, not the compose-generated `<project>_adexto-network`. The
    # self-hosted Graph Node in subgraph/docker-compose.yml joins this network as
    # `external` so the web container can reach it as http://graph-node:8000
    # without publishing the indexer on a host port. A generated name would
    # depend on the directory name, which differs between local and the VPS.
    name: adexto-net
    driver: bridge
