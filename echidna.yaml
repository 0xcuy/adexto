# Echidna configuration for the curve harness in contracts/echidna/.
#
# `testMode: property`: Echidna calls public functions at random and checks that every
# `echidna_*` function still returns true. The properties read more clearly as boolean
# functions than as assertions inside actions.
testMode: property
# 50,000 calls: enough to build a meaningful corpus without making the check slow enough that
# people turn it off.
testLimit: 50000
seqLen: 64
# The curve needs native to be bought. Without a balance every `buy` exits early and only the
# empty path is tested.
balanceContract: 5000000000000000000000000
corpusDir: build/security/echidna-corpus
format: text
